<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CHENARI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 20px;">
                <span>C</span><span>H</span><span>E</span><span>N</span><span>A</span><span>R</span><span>I</span>
            </a>
            <h1 class="serif">Welcome Back</h1>
            <p>Please enter your details to sign in.</p>
        </div>

        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link" id="forgotPass">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider">
            <span>Or continue with</span>
        </div>

        <button class="google-btn" id="googleBtn">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="google-icon" style="width: 20px; height: 20px; margin-right: 10px;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
            Sign in with Google
        </button>

        <p class="signup-redirect">
            Don't have an account? <a href="signup.html">Create one for free</a>
        </p>
    </div>

    <!-- Scripts -->
    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="auth-modal-overlay">
        <div class="auth-modal-content">
            <button id="closeForgotModal" class="modal-close-btn">&times;</button>
            <div class="auth-modal-header" style="margin-bottom: 20px;">
                <h2 class="serif">Reset Password</h2>
                <p>Enter your email to receive a password reset link.</p>
            </div>
            <form id="forgotPasswordForm" class="auth-form" style="text-align: left;">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" required>
                </div>
                <button type="submit" class="login-btn" style="margin-top: 10px;">Send Reset Link</button>
            </form>
        </div>
    </div>

    <script type="module" src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Simple Theme Check for Login Page
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', currentTheme);
    </script>
</body>
</html>
