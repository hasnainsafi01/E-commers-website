<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection | CHENARI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <span>C</span><span>H</span><span>E</span><span>N</span><span>A</span><span>R</span><span>I</span>
            </a>
            <div class="mobile-toggle"><i class="fas fa-bars"></i></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Collection</a></li>
                <li><a href="cart.html">Bag</a></li>
            </ul>
            <div class="nav-actions">
                <div class="theme-toggle"><i class="fas fa-moon"></i></div>
                <a href="cart.html" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge">3</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Product Listing Controls -->
    <section class="listing-controls">
        <h1 class="serif" style="font-size: 3rem; margin-bottom: 30px;">Our Collection</h1>
        
        <div class="filters-wrapper">
            <!-- Category Filters -->
            <div class="category-chips">
                <button class="chip active" data-category="all">All Items</button>
                <button class="chip" data-category="watches">Watches</button>
                <button class="chip" data-category="bags">Bags</button>
                <button class="chip" data-category="shoes">Shoes</button>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search our heritage...">
            </div>

            <!-- Sorting -->
            <div class="sorting">
                <select id="sortSelect" class="sort-select">
                    <option value="default">Sort by: Default</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="products" style="padding-top: 30px;">
        <div id="productsList" class="product-grid">
            <!-- Skeletons injected here by JS -->
        </div>
    </section>

    <script src="assets/js/main.js"></script>
    <script type="module" src="assets/js/navbar-auth.js"></script>
    <script>
        // Handle URL parameters for initial category filter
        const urlParams = new URLSearchParams(window.location.search);
        const initialCat = urlParams.get('category');
        if (initialCat) {
            document.addEventListener('DOMContentLoaded', () => {
                const chip = document.querySelector(`.chip[data-category="${initialCat.toLowerCase()}"]`);
                if (chip) chip.click();
            });
        }
    </script>
</body>
</html>
