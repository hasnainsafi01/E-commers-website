<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wishlist | MyMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="mobile-toggle"><i class="fas fa-bars"></i></div>
            <!-- Logo -->
            <a href="index.html" class="logo">
                <span style="color:var(--primary-blue);">M</span><span style="color:var(--primary-red);">y</span><span style="color:var(--primary-green);">M</span><span style="color:var(--primary-orange);">a</span><span style="color:var(--light-red);">r</span><span style="color:var(--dark-green);">t</span>
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html?category=watches">Watches</a></li>
                <li><a href="products.html?category=bags">Bags</a></li>
                <li><a href="products.html?category=shoes">Shoes</a></li>
            </ul>

            <!-- Search Bar (Desktop) -->
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearchInput" placeholder="Search MyMart items...">
                <div id="searchResults" class="search-results-dropdown hidden"></div>
            </div>

            <!-- Nav Actions (Icons & Profile) -->
            <div class="nav-actions">
                <div class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </div>

                <a href="favorites.html" title="Favorites" class="auth-guarded" data-action="fav">
                    <i class="far fa-heart"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>

                <a href="cart.html" title="Shopping Cart" class="auth-guarded" data-action="cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>
                
                <div id="navbarAuth" class="nav-auth-group"></div>
            </div>
        </nav>
    </header>

    <!-- Favorites Container -->
    <main class="favorites-container">
        <div class="favorites-header">
            <h1 class="serif">Your Wishlist</h1>
            <p id="favCountDisplay">0 ITEMS SAVED</p>
        </div>

        <!-- Empty State UI -->
        <div id="emptyFavoritesUI" class="empty-favorites-ui hidden">
            <i class="far fa-heart"></i>
            <h2 class="serif">Nothing saved yet</h2>
            <p>Save items you love to your wishlist to review or buy them later.</p>
            <a href="products.html" class="explore-btn">Discover Items</a>
        </div>

        <!-- Favorites Grid -->
        <div id="favoritesGrid" class="product-grid hidden">
            <!-- Dynamic favorite cards will be injected here -->
        </div>
    </main>

    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/cart.js"></script>
    <script type="module" src="assets/js/favorites.js"></script>
    <script type="module" src="assets/js/navbar-auth.js"></script>
</body>
</html>
