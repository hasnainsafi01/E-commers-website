<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | Atelier Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Admin CSS -->
    <link rel="stylesheet" href="assets/css/admin.css">
    <!-- Admin Security Route Guard -->
    <script type="module" src="assets/js/admin-guard.js"></script>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                MyMart Admin
                <span>Inventory Control</span>
            </div>

            <!-- Admin Profile Card in Sidebar -->
            <div class="sidebar-profile-card" style="
                padding: 15px;
                margin: 0 15px 25px 15px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                text-align: center;
            ">
                <img id="sidebarAdminAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231a1a1a'/%3E%3Ccircle cx='50' cy='35' r='20' fill='%23ffffff' opacity='0.3'/%3E%3Cpath d='M20 80c0-15 12-25 30-25s30 10 30 25' fill='%23ffffff' opacity='0.3'/%3E%3C/svg%3E" alt="Admin" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255, 255, 255, 0.15);">
                <div style="display: flex; flex-direction: column; gap: 2px; width: 100%; overflow: hidden;">
                    <span id="sidebarAdminName" style="font-weight: 600; font-size: 0.8rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Admin</span>
                    <span id="sidebarAdminEmail" style="font-size: 0.7rem; color: rgba(255, 255, 255, 0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;"></span>
                    <div style="margin-top: 3px;">
                        <span id="sidebarAdminRole" style="
                            font-size: 0.6rem;
                            font-weight: 700;
                            text-transform: uppercase;
                            letter-spacing: 0.5px;
                            background: rgba(255, 255, 255, 0.06);
                            color: #fff;
                            border: 1px solid rgba(255, 255, 255, 0.1);
                            padding: 2px 8px;
                            border-radius: 10px;
                            display: inline-block;
                        ">Chief Curator</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="manage-products.html" class="nav-item">
                    <i class="fas fa-box"></i> Inventory
                </a>
                <a href="stock.html" class="nav-item">
                    <i class="fas fa-cubes"></i> Stock Control
                </a>
                <a href="categories.html" class="nav-item">
                    <i class="fas fa-tags"></i> Categories
                </a>
                <a href="orders.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i> Orders
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="reviews.html" class="nav-item">
                    <i class="fas fa-star"></i> Reviews
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="far fa-question-circle"></i> Support
                </a>
                <a href="#" class="nav-item admin-logout-btn" id="sidebarLogoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1 class="serif">Add New Product</h1>
                    <p>Catalog high-end pieces into the collection.</p>
                </div>
            </header>

            <form id="addProductForm" class="form-container">
                <div class="form-grid">
                    <!-- Title -->
                    <div class="form-group full-width">
                        <label for="prodTitle">Product Title</label>
                        <input type="text" id="prodTitle" placeholder="e.g. Midnight Classic Chronograph" required>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="prodCategory">Category</label>
                        <select id="prodCategory" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Watches">Watches</option>
                            <option value="Bags">Bags</option>
                            <option value="Shoes">Shoes</option>
                        </select>
                    </div>

                    <!-- Price -->
                    <div class="form-group">
                        <label for="prodPrice">Price (PKR)</label>
                        <input type="number" id="prodPrice" step="0.01" placeholder="0.00" required>
                    </div>

                    <!-- Discount -->
                    <div class="form-group">
                        <label for="prodDiscount">Discount (%)</label>
                        <input type="number" id="prodDiscount" placeholder="0">
                    </div>

                    <!-- Stock -->
                    <div class="form-group">
                        <label for="prodStock">Stock Quantity</label>
                        <input type="number" id="prodStock" placeholder="0" required>
                    </div>

                    <!-- Rating -->
                    <div class="form-group">
                        <label for="prodRating">Manual Rating (out of 5)</label>
                        <input type="number" id="prodRating" min="1" max="5" step="0.1" placeholder="4.5" required>
                    </div>

                    <!-- Description -->
                    <div class="form-group full-width">
                        <label for="prodDesc">Product Description</label>
                        <textarea id="prodDesc" placeholder="Describe the heritage and craftsmanship of this piece..." required></textarea>
                    </div>
                </div>

                <!-- Media Upload -->
                <div class="dropzone-container">
                    <label style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--admin-text-secondary); margin-bottom: 10px; display: block;">Product Media</label>
                    <div id="imageDropzone" class="dropzone">
                        <i class="far fa-images"></i>
                        <p>Drag and drop images here or <strong>browse files</strong></p>
                        <input type="file" id="productImages" multiple accept="image/*" style="display: none;">
                    </div>
                    <div id="previewGrid" class="image-preview-grid">
                        <!-- Previews injected here -->
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div id="uploadProgressContainer" class="progress-container" style="display: none; margin-bottom: 20px;">
                    <div class="progress-info">
                        <span id="uploadStatusText">Uploading images...</span>
                        <span id="uploadPercentage">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="uploadProgressBar" class="progress-bar-fill"></div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-ghost">Save Draft</button>
                    <button type="submit" id="publishBtn" class="btn-publish">
                        <i class="fas fa-paper-plane"></i> Publish Product
                    </button>
                </div>
            </form>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast-container">
        <div id="statusToast" class="toast">
            <i class="fas fa-check-circle"></i>
            <span>Product Published!</span>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/add-product.js"></script>
</body>
</html>
