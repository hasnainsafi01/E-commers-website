<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | MyMart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.admin-login-page {
            background: #080808;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background luxury glow */
        body.admin-login-page::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
        }
        body.admin-login-page::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(66, 133, 244, 0.03) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            z-index: 0;
        }

        .admin-login-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            z-index: 10;
            text-align: center;
            box-sizing: border-box;
            animation: fadeInAdminCard 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInAdminCard {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .admin-logo {
            display: inline-flex;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .admin-login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #fff;
            margin: 10px 0 5px 0;
            letter-spacing: 0.5px;
        }

        .admin-login-card p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 40px 0;
            font-weight: 600;
        }

        .admin-form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .admin-form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .admin-form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .admin-form-group input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }

        .admin-submit-btn {
            width: 100%;
            padding: 16px 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-submit-btn:hover {
            background: #e5e5e5;
        }

        .admin-submit-btn:active {
            transform: scale(0.98);
        }

        .admin-submit-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .admin-error-box {
            background: rgba(255, 59, 48, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: 6px;
            padding: 12px 15px;
            color: #ff3b30;
            font-size: 0.8rem;
            margin-bottom: 25px;
            display: none;
            text-align: left;
            line-height: 1.5;
        }

        .admin-back-link {
            display: inline-block;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            text-decoration: none;
            transition: color 0.2s;
            letter-spacing: 0.5px;
        }

        .admin-back-link:hover {
            color: #fff;
        }

        .admin-back-link i {
            margin-right: 5px;
        }
    </style>
</head>
<body class="admin-login-page">

    <div class="admin-login-card">
        <div class="admin-header">
            <a href="index.html" class="admin-logo">
                <span style="color:#4285F4;">M</span><span style="color:#EA4335;">y</span><span style="color:#34A853;">M</span><span style="color:#FBBC05;">a</span><span style="color:#ff5a5f;">r</span><span style="color:#2e7d32;">t</span>
            </a>
            <h1>Portal Access</h1>
            <p>Admin Dashboard Verification</p>
        </div>

        <div class="admin-error-box" id="adminErrorBox"></div>

        <form id="adminLoginForm">
            <div class="admin-form-group">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" required placeholder="admin@mymart.com" autocomplete="email">
            </div>
            
            <div class="admin-form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="admin-submit-btn" id="adminSubmitBtn">
                Verify Credentials
            </button>
        </form>

        <a href="index.html" class="admin-back-link">
            <i class="fas fa-arrow-left"></i> Return to Storefront
        </a>
    </div>

    <!-- Firebase Auth & Admin Script -->
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script>
        // Set body theme directly to dark
        document.body.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
