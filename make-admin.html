<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Make Admin</title>
</head>
<body>
    <h1>Make Admin/Curator Helper</h1>
    <button id="btn">Set admin@mymart.com as Admin</button>
    <div id="output"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB51QUy-6JfhsIBAIET2wQxTc9Yp1RXekY",
          authDomain: "portfolio-8f1ca.firebaseapp.com",
          projectId: "portfolio-8f1ca",
          storageBucket: "portfolio-8f1ca.firebasestorage.app",
          messagingSenderId: "261283936769",
          appId: "1:261283936769:web:ce65b52a9dbc1df0f6de00"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btn').onclick = async () => {
            try {
                const email = "admin@mymart.com";
                const password = "password123";
                
                document.getElementById('output').innerText = "Logging in / Registering...";
                let credential;
                try {
                    credential = await signInWithEmailAndPassword(auth, email, password);
                } catch(e) {
                    document.getElementById('output').innerText = "Attempting registration: " + e.message;
                    const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
                    credential = await createUserWithEmailAndPassword(auth, email, password);
                }
                
                const user = credential.user;
                const userRef = doc(db, 'users', user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    name: 'Main Administrator',
                    displayName: 'Main Administrator',
                    email: user.email,
                    role: 'admin',
                    profileCompleted: true
                }, { merge: true });
                
                document.getElementById('output').innerText = "SUCCESS! User admin@mymart.com is now admin role in Firestore. UID: " + user.uid;
            } catch (err) {
                document.getElementById('output').innerText = "ERROR: " + err.message;
            }
        };
    </script>
</body>
</html>
