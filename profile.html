<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | CHENARI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <span>C</span><span>H</span><span>E</span><span>N</span><span>A</span><span>R</span><span>I</span>
            </a>
            <div class="mobile-toggle"><i class="fas fa-bars"></i></div>
            <div class="nav-actions">
                <div class="theme-toggle"><i class="fas fa-moon"></i></div>
                
                <a href="favorites.html" title="Favorites">
                    <i class="far fa-heart"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>

                <a href="cart.html" title="Shopping Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- Profile Dashboard -->
    <main class="profile-container">
        <!-- Sidebar: User Info -->
        <aside class="profile-sidebar">
            <div class="profile-avatar">
                <img id="userProfileImage" src="https://ui-avatars.com/api/?name=User" alt="User">
            </div>
            <h1 id="userProfileName" class="profile-name serif">Loading...</h1>
            <p id="userProfileEmail" class="profile-email">---</p>
            
            <button class="edit-profile-btn">Edit Profile</button>
            
            <button id="profileLogoutBtn" class="logout-btn-large">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </aside>

        <!-- Main Content: Stats & History -->
        <section class="profile-main">
            <h2 class="serif">Dashboard</h2>
            
            <div class="profile-stats">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-box"></i></div>
                    <div class="stat-value">0</div>
                    <div class="stat-label">Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-heart"></i></div>
                    <div id="favStatCount" class="stat-value">0</div>
                    <div class="stat-label">Wishlist</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
                    <div id="cartStatCount" class="stat-value">0</div>
                    <div class="stat-label">In Bag</div>
                </div>
            </div>

            <!-- Order History -->
            <div class="orders-section">
                <h3 class="serif">Recent Orders</h3>
                <div class="empty-orders">
                    <i class="fas fa-receipt"></i>
                    <p>You haven't placed any orders yet. Start your luxury journey today.</p>
                    <a href="products.html" class="btn-primary">Shop Now</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
    <script type="module" src="assets/js/navbar-auth.js"></script>
</body>
</html>
