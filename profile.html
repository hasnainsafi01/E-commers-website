<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | CHENARI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="mobile-toggle"><i class="fas fa-bars"></i></div>
            <a href="index.html" class="logo">
                <span>C</span><span>H</span><span>E</span><span>N</span><span>A</span><span>R</span><span>I</span>
            </a>
            
            <div class="nav-actions">
                <div class="mobile-search-btn" id="mobileSearchBtn"><i class="fas fa-search"></i></div>
                <div class="theme-toggle"><i class="fas fa-moon"></i></div>
                <a href="favorites.html" title="Favorites" class="auth-guarded" data-action="fav">
                    <i class="far fa-heart"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" title="Shopping Cart" class="auth-guarded" data-action="cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" style="display:none;">0</span>
                </a>
                <div id="navbarAuth" class="nav-auth-group"></div>
            </div>
        </nav>
    </header>

    <!-- Profile Dashboard -->
    <main class="profile-container">
        <!-- Sidebar: User Info -->
        <aside class="profile-sidebar">
            <div class="profile-avatar-container">
                <img id="userProfileImage" src="https://ui-avatars.com/api/?name=User" alt="User">
                <div class="avatar-edit-overlay" id="editAvatarBtn">
                    <i class="fas fa-camera"></i>
                </div>
            </div>
            <h1 id="userProfileName" class="profile-name serif">Loading...</h1>
            <p id="userProfileEmail" class="profile-email">---</p>
            
            <button id="editProfileSidebarBtn" class="edit-profile-btn">Edit Profile</button>
            
            <button id="profileLogoutBtn" class="logout-btn-large">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </aside>

        <!-- Main Content: Stats & History -->
        <section class="profile-main">
            <h2 class="serif">Your Activity</h2>
            
            <div class="profile-stats">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-box"></i></div>
                    <div class="stat-value">0</div>
                    <div class="stat-label">Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-heart"></i></div>
                    <div id="favStatCount" class="stat-value">0</div>
                    <div class="stat-label">Wishlist</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
                    <div id="cartStatCount" class="stat-value">0</div>
                    <div class="stat-label">In Bag</div>
                </div>
            </div>

            <!-- Order History -->
            <div class="orders-section">
                <h3 class="serif">Recent Orders</h3>
                <div class="empty-orders">
                    <i class="fas fa-receipt"></i>
                    <p>You haven't placed any orders yet. Start your luxury journey today.</p>
                    <a href="products.html" class="btn-primary">Shop Now</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="auth-modal-overlay">
        <div class="auth-modal-content edit-profile-content" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);">
            <button id="closeEditProfileBtn" class="modal-close-btn">&times;</button>
            <div class="auth-modal-header" style="margin-bottom: 20px;">
                <h2 class="serif">Edit Profile</h2>
                <p>Update your personal information.</p>
            </div>
            
            <form id="editProfileForm" class="auth-form" style="text-align: left;">
                <div class="image-upload-wrapper" style="text-align: center; margin-bottom: 25px;">
                    <label for="profileImageInput" class="upload-circle" style="cursor: pointer; display: inline-block; position: relative;">
                        <img id="editModalImagePreview" src="https://ui-avatars.com/api/?name=User" alt="Preview" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--nav-border);">
                        <div style="position: absolute; bottom: 0; right: 0; background: var(--primary-blue); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                            <i class="fas fa-camera" style="font-size: 12px;"></i>
                        </div>
                    </label>
                    <input type="file" id="profileImageInput" accept="image/jpeg, image/png, image/webp" style="display: none;">
                </div>

                <div class="form-group">
                    <label for="editFullName">Full Name</label>
                    <input type="text" id="editFullName" required>
                </div>
                
                <div class="form-group">
                    <label for="editEmail">Email Address</label>
                    <input type="email" id="editEmail" readonly style="background-color: #f5f5f5; cursor: not-allowed; color: #777;">
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 25px; width: 100%;">
                    <button type="button" id="cancelEditProfileBtn" class="btn-secondary" style="flex: 1; margin-bottom: 0;">Cancel</button>
                    <button type="submit" class="login-btn" style="flex: 1; margin-bottom: 0; margin-top: 0;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
    <script type="module" src="assets/js/navbar-auth.js"></script>
</body>
</html>
