<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Control | MyMart Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Admin CSS -->
    <link rel="stylesheet" href="assets/css/admin.css">
    <!-- Admin Security Route Guard -->
    <script type="module" src="assets/js/admin-guard.js"></script>
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                MyMart Admin
                <span>Inventory Control</span>
            </div>

            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="manage-products.html" class="nav-item">
                    <i class="fas fa-box"></i> Inventory
                </a>
                <a href="stock.html" class="nav-item active">
                    <i class="fas fa-cubes"></i> Stock Control
                </a>
                <a href="categories.html" class="nav-item">
                    <i class="fas fa-tags"></i> Categories
                </a>
                <a href="orders.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i> Orders
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="reviews.html" class="nav-item">
                    <i class="fas fa-star"></i> Reviews
                </a>

                <a href="add-product.html" class="add-product-btn" style="display: block; text-align: center; text-decoration: none;">Add Product</a>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item">
                    <i class="far fa-question-circle"></i> Support
                </a>
                <a href="index.html" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1 class="serif">Stock Control Center</h1>
                    <p id="stockCount">Checking stock status...</p>
                </div>
            </header>

            <!-- Table Controls -->
            <div class="manage-header">
                <div class="search-filter-group">
                    <div class="admin-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="stockSearch" placeholder="Search by product name...">
                    </div>
                    <select id="stockStatusFilter" class="admin-filter">
                        <option value="all">All Statuses</option>
                        <option value="healthy">Healthy (10+)</option>
                        <option value="low">Low Stock (<10)</option>
                        <option value="out">Out of Stock (0)</option>
                    </select>
                </div>
            </div>

            <!-- Stock Table -->
            <div class="manage-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product Details</th>
                            <th>Category</th>
                            <th>Current Stock</th>
                            <th>Alert Threshold</th>
                            <th>Quick Restock</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Dynamic stock details loaded here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast-container">
        <div id="statusToast" class="toast">
            <i class="fas fa-check-circle"></i>
            <span>Action Successful!</span>
        </div>
    </div>

    <!-- Script -->
    <script type="module" src="assets/js/stock.js"></script>
</body>
</html>
